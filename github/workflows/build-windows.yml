- name: Install dependencies
    run: |
      sudo apt update
      sudo apt install -y build-essential mingw-w64 wget vim-common make

  - name: Build exe
    working-directory: ${{ github.workspace }}
    run: |
      set -e
      make newflasher.exe

  - name: Upload artifact
    uses: actions/upload-artifact@v4
    with:
      name: newflasher-win
      path: newflasher.exe
