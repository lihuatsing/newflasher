name: build-windows
on:
  workflow_dispatch:
    inputs:
      dummy:
        description: manual run
  push:
    paths:
      - '**/*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential mingw-w64 wget xxd make

      - name: Pre‑download lib packages
        run: |
          set -euo pipefail
          rm -f zlib-1.3.1.tar.gz
          wget -O zlib-1.3.1.tar.gz https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
          rm -f expat-2.2.9.tar.gz
          wget -O expat-2.2.9.tar.gz https://github.com/libexpat/libexpat/releases/download/R_2_2_9/expat-2.2.9.tar.gz

      - name: Unpack libraries
        run: |
          set -euo pipefail
          test -d zlib-1.3.1 || tar xzf zlib-1.3.1.tar.gz
          test -d expat-2.2.9 || tar xzf expat-2.2.9.tar.gz

      - name: Build newflasher.exe
        run: |
          set -euo pipefail
          rm -f newflasher.exe
          cd zlib-1.3.1 && CC=i686-w64-mingw32-gcc ./configure --static && make clean && make
          cd ../expat-2.2.9 && CC="i686-w64-mingw32-gcc -fPIC" ./configure --enable-static --disable-shared --host=i686-w64-mingw32 && make clean && make
          cd ..
          i686-w64-mingw32-gcc -Wall -g -O2 newflasher.c -o newflasher.exe -I include -I zlib-1.3.1 -L zlib-1.3.1 -I expat-2.2.9/lib -L expat-2.2.9/lib/.libs -lz -lexpat
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: newflasher-win
          path: newflasher.exe
