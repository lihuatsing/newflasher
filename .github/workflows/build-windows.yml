name: build-windows
on:
  workflow_dispatch:
  push:
    paths:
      - '**.c'
      - '**.h'
      - 'Makefile'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build exe
        run: |
          choco install mingw -y
          make newflasher.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: newflasher-win
          path: newflasher.exe
